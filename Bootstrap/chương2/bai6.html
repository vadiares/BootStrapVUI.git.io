<!doctype html>
<html lang="en" data-bs-theme="light">
    <head>
        <title>Bài 2.6 - Màu chữ theo ngữ cảnh</title>

        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <!-- Bootstrap CSS v5.3.8 -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
            crossorigin="anonymous"
        />
    </head>
    <body>

        <div class="container mt-4">
            <h1>Màu chữ theo ngữ cảnh</h1>
            <p>Sử dụng các class màu chữ theo ngữ cảnh.</p>

            <div class="text-primary mb-2">
                Văn bản quan trọng.
            </div>

            <div class="text-success mb-2">
                Văn bản chỉ ra sự thành công.
            </div>

            <div class="text-info mb-2">
                Văn bản chứa thông tin.
            </div>

            <div class="text-warning mb-2">
                Văn bản này là cảnh báo.
            </div>

            <div class="text-danger mb-2">
                Văn bản thông báo sự nguy hiểm.
            </div>

            <div class="text-secondary mb-2">
                Màu chữ phụ.
            </div>

            <div class="text-dark mb-2">
                Màu chữ xám đen.
            </div>

            <div class="text-light bg-dark mb-2">
                Màu chữ xám trắng.
            </div>
        </div>
        <!-- Bootstrap JavaScript Bundle -->
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"
        ></script>
    </body>
</html>
